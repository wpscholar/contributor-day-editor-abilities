name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs the same checks before it builds a zip.
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build chat panel
        run: npm run build

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          # The lowest supported version, so the tools run where the code must.
          php-version: '8.0'
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: |
          npm ci
          composer install --no-interaction --no-progress

      - name: Lint JavaScript and TypeScript
        run: npm run lint:js

      - name: Lint PHP (PHPCS and PHPStan)
        run: composer lint

  phpunit:
    name: phpunit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Unit tests (PHP)
        run: composer test

  e2e:
    name: e2e (WP ${{ matrix.wp }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      # One failing combination should not hide how the others fared.
      fail-fast: false
      matrix:
        # Every supported WordPress and PHP version. `latest` follows each
        # WordPress release; when a new minor ships, add the one it replaces.
        wp: ['7.0', 'latest']
        php: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # The chat panel is compiled; without build/ the screens that load it
      # show a "run npm run build" notice instead.
      - name: Build chat panel
        run: npm run build

      - name: Run e2e tests
        run: npm run test:e2e
        env:
          WP_VERSION: ${{ matrix.wp }}
          PHP_VERSION: ${{ matrix.php }}

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-wp${{ matrix.wp }}-php${{ matrix.php }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
