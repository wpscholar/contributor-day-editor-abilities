name: Attach release zip

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build plugin zip
        run: npm run zip

      - name: Attach zip to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/agentic-editor.zip
